name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC token write is required for:
#   - Azure login (federated credential, no stored client secret)
#   - Cosign keyless sign (uses the GitHub OIDC identity)
permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: crshoplite.azurecr.io
  REGISTRY_SHORT: crshoplite

jobs:
  # ---------------------------------------------------------------------------
  # Lint — ruff on both apps. Fast fail if the code style is off.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint
        run: ruff check apps/

      - name: Format check
        run: ruff format --check apps/

  # ---------------------------------------------------------------------------
  # Test — minimal pytest smoke test proving the apps import cleanly.
  # Expand with real tests over time.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/${{ matrix.app }}/requirements.txt

      - name: Install deps + pytest
        working-directory: apps/${{ matrix.app }}
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.3

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Build → SBOM → Scan → Sign → Push. One matrix entry per app, runs
  # in parallel. Push + sign only on main (not on PRs).
  # ---------------------------------------------------------------------------
  build-scan-sign:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]

    env:
      IMAGE: crshoplite.azurecr.io/shoplite-${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "ref=${{ env.IMAGE }}:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----- Build -----
      - name: Build image (load to local docker)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.ref }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # ----- SBOM -----
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tag.outputs.ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      # ----- Scan -----
      - name: Trivy — vulnerability scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library

      - name: Trivy — informational scan (HIGH + MEDIUM, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.ref }}
          format: table
          severity: HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true

      # ----- Push + sign — only on push to main (not PRs) -----
      - name: Azure login via OIDC
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login (short-lived token)
        if: github.event_name == 'push'
        run: az acr login --name ${{ env.REGISTRY_SHORT }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.ref }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Resolve image digest
        if: github.event_name == 'push'
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.tag.outputs.ref }} \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Cosign — keyless sign (OIDC identity)
        if: github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: cosign sign ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}

      - name: Cosign — attest SBOM
        if: github.event_name == 'push'
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate sbom-${{ matrix.app }}.spdx.json \
            --type spdxjson \
            ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}

      - name: Summary
        if: github.event_name == 'push'
        run: |
          echo "## ${{ matrix.app }} built, signed, pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.tag.outputs.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy — STUBBED. When Argo Rollouts is installed (Phase 11), this will
  # bump api.image.tag in gitops/staging/shoplite.yaml via a PR, which Argo
  # auto-syncs. Prod promotion is a separate manual PR.
  # ---------------------------------------------------------------------------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-scan-sign
    if: github.event_name == 'push' && false   # DISABLED — enable after Phase 11
    steps:
      - name: Placeholder
        run: echo "Deploy step will be enabled after Argo Rollouts installation."
