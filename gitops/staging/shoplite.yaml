# The shoplite app for staging. Rendered from charts/shoplite with
# values-staging.yaml. Argo CD will sync this into the shoplite-staging
# namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pavan-AIML/st_repo.git
    targetRevision: main
    path: charts/shoplite
    helm:
      releaseName: shoplite
      valueFiles:
        - values-staging.yaml
      # Images are pinned by digest in values-staging.yaml (Kyverno
      # verifyImages requires repository@sha256:...), so no parameter
      # overrides for the tag are needed.
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite-staging
  # Workaround for Argo CD v2.12 OpenAPI schema not knowing about K8s 1.33's
  # new .status.terminatingReplicas field — without this, structured-merge
  # diff fails and the sync aborts silently. Remove once we're on Argo CD
  # v2.13+ which ships an updated schema.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: ReplicaSet
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: StatefulSet
      jsonPointers: ["/status/terminatingReplicas"]
    # Argo Rollouts controller + HPA + manual `kubectl rollout restart` all
    # mutate fields on the live Rollout. Ignore the ones not owned by GitOps so
    # Argo CD doesn't fight the specialist controllers. Git stays source of truth
    # for strategy, steps, template, probes, resources, etc.
    - group: argoproj.io
      kind: Rollout
      name: shoplite-shoplite-api
      jqPathExpressions:
        - '.spec.replicas'              # HPA writes this
        - '.spec.restartAt'             # `kubectl rollout restart` writes this
        - '.metadata.annotations'       # last-applied-config + rollout.argoproj.io/revision
    # Prometheus Operator adds validation labels/annotations on PrometheusRule
    # after apply; ignore to prevent perpetual OutOfSync.
    - group: monitoring.coreos.com
      kind: PrometheusRule
      name: shoplite-shoplite-api-slo
      jqPathExpressions:
        - '.metadata.annotations'
        - '.metadata.labels'
  # Argo creates the namespace with these labels baked in. The restricted
  # Pod Security Standard is enforced on every pod created here.
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply disabled because Argo CD v2.12.6's server-side diff
      # engine chokes on K8s 1.33's new .status.terminatingReplicas field
      # with "field not declared in schema". Client-side apply works fine.
      # Re-enable once we move to Argo CD v2.13+.
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
