# Tempo — distributed tracing backend. Receives OTLP spans from the api
# (see apps/api/main.py OTEL_EXPORTER_OTLP_ENDPOINT) and stores them on
# local filesystem. Single-binary mode keeps the footprint small; a real
# deployment would use object storage + microservices.
#
# Grafana (installed by kube-prometheus-stack) auto-discovers Tempo via
# the datasource label below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: tempo
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.14.0
    helm:
      releaseName: tempo
      values: |
        tempo:
          retention: 24h
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
                grpc:
                  endpoint: 0.0.0.0:4317
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
        persistence:
          enabled: false
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# Grafana datasource for Tempo — picked up by the kube-prometheus-stack
# grafana sidecar (label grafana_datasource=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3100
        uid: tempo
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            tags: [{ key: 'service.name', value: 'service_name' }]
