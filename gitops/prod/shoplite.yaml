# The shoplite app for prod. Promotion = PR that bumps api.image.tag or
# worker.image.tag below after it's been verified in staging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pavan-AIML/st_repo.git
    targetRevision: main
    path: charts/shoplite
    helm:
      releaseName: shoplite
      valueFiles:
        - values-prod.yaml
      # Images pinned by digest in values-prod.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite-prod
  # Workaround for Argo CD v2.12 schema not knowing K8s 1.33's
  # .status.terminatingReplicas. Remove on Argo CD v2.13+.
  ignoreDifferences:
    - group: argoproj.io
      kind: Deployment
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: Deployment
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: ReplicaSet
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: StatefulSet
      jsonPointers: ["/status/terminatingReplicas"]
    - group: argoproj.io
      kind: Rollout
      name: shoplite-soplite-api
      jqPathExpressions:
        - '.spec.template.spec.containers[].image'
        - '.spec.replicas'
    - group: monitoring.coreos.com
      kind: PrometheusRule
      name: shoplite-shoplite-api-slo
      jqpPathExpressions:
        - '.metadata.annotations'
        - '.metadata.labels'


  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply disabled per Argo CD v2.12 vs K8s 1.33 diff bug.
      # See gitops/staging/shoplite.yaml for details.
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
