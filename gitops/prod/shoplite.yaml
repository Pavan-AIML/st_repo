# The shoplite app for prod. Promotion = PR that bumps api.image.tag or
# worker.image.tag below after it's been verified in staging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Pavan-AIML/st_repo.git
    targetRevision: main
    path: charts/shoplite
    helm:
      releaseName: shoplite
      valueFiles:
        - values-prod.yaml
      # Images pinned by digest in values-prod.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite-prod
  # Workaround for Argo CD v2.12 schema not knowing K8s 1.33's
  # .status.terminatingReplicas. Remove on Argo CD v2.13+.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: ReplicaSet
      jsonPointers: ["/status/terminatingReplicas"]
    - group: apps
      kind: StatefulSet
      jsonPointers: ["/status/terminatingReplicas"]
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
