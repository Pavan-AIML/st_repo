[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Rule groups: pycodestyle errors, pyflakes, imports, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests"]
