# Default values. Each env (staging, prod) overrides a subset in its own
# values-<env>.yaml file. Keep this file conservative — "if nothing overrides,
# we should still render a safe deployment."

# ---------------------------------------------------------------------------
# Env identity — overridden per env.
# ---------------------------------------------------------------------------
env: dev
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Image registry — overridden per env (crshoplitestaging vs crshopliteprod).
# ---------------------------------------------------------------------------
image:
  registry: crshoplitedev.azurecr.io
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# ServiceAccount — Workload Identity enabled.
# Set clientId per env to the Entra client ID from Terraform output
# `workload_identity_client_ids["shoplite"]`.
# ---------------------------------------------------------------------------
serviceAccount:
  name: shoplite
  workloadIdentityClientId: ""   # REQUIRED per env

# ---------------------------------------------------------------------------
# Redis — now in-cluster via the Bitnami chart (per ADR-003).
# Each env has its own Redis in its namespace at redis-master.<ns>.svc.
# ---------------------------------------------------------------------------
redis:
  url: "redis://redis-master.default.svc.cluster.local:6379"

# ---------------------------------------------------------------------------
# api — HTTP service, HPA-scaled on CPU.
# ---------------------------------------------------------------------------
api:
  image:
    repository: shoplite-api
    tag: "0.1.0"
  replicaCount: 2
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1

# ---------------------------------------------------------------------------
# worker — background consumer, no HTTP port.
# ---------------------------------------------------------------------------
worker:
  image:
    repository: shoplite-worker
    tag: "0.1.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  pdb:
    minAvailable: 1

# ---------------------------------------------------------------------------
# Secrets — ExternalSecret (Phase 5) will pull these from Key Vault.
# Feature-flagged off until ESO is installed in the cluster.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false
  secretStoreName: azure-keyvault
  secretName: shoplite-secrets
  refreshInterval: 1h
  vaultUrl: ""   # REQUIRED per env when enabled=true
  tenantId: ""   # REQUIRED per env when enabled=true

# ---------------------------------------------------------------------------
# Ingress — public HTTPS endpoint via ingress-nginx + Let's Encrypt staging.
# host should be an FQDN resolvable to the ingress-nginx LB IP (nip.io works).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  host: ""
  clusterIssuer: letsencrypt-staging

# ---------------------------------------------------------------------------
# NetworkPolicies — zero-trust networking at the pod level.
# Enable per-env in values-<env>.yaml and set the right CIDRs.
# ---------------------------------------------------------------------------
networkPolicies:
  enabled: false
  # Namespace where ingress-nginx is installed (for the ingress-to-api allow).
  ingressNamespace: ingress-nginx
  # Env-specific CIDRs — override per env.
  postgresSubnetCidr: 10.40.18.0/24     # staging db subnet by default
  vnetCidr: 10.40.0.0/16
  podCidr: 10.244.0.0/16
  serviceCidr: 10.0.0.0/16

# ---------------------------------------------------------------------------
# RBAC — namespace-scoped Role + RoleBinding for devs. Granted to an Entra
# group. Role exists even if no group is bound (safe default).
# ---------------------------------------------------------------------------
rbac:
  devReadonly:
    enabled: true
    groupObjectId: ""   # set per env to an Entra group object ID
