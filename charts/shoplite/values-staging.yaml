# Staging overrides. Only the keys that differ from the chart defaults.
# Everything else inherits from values.yaml.

env: staging

image:
  # Shared ACR per ADR-002 — same registry for both envs.
  registry: crshoplite.azurecr.io

serviceAccount:
  name: shoplite
  # From `terraform output workload_identity_client_ids` in envs/staging/.
  workloadIdentityClientId: "32d99ae1-5ef0-4026-ac45-5f79c321dd70"

redis:
  url: "redis://redis-master.shoplite-staging.svc.cluster.local:6379"

api:
  image:
    repository: shoplite-api
    tag: "af3f30d362f5"
    # Signed by CI (Cosign keyless) at commit af3f30d. Phase 13 drill
    # (BAD_BUILD_ERROR_PCT=20) completed on 2026-10-25; staging is back
    # on this known-good digest. See postmortem INC-20261025-001.
    digest: "sha256:165f9470fc86d9cbb457bf8c7413d40ebe92480a263ea7f6eaaf33d3802a7ad6"
  replicaCount: 2
  # T1-C acceptance test — proving staging-only promotion. Prod's resource
  # block in values-prod.yaml is untouched by this change.
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Progressive delivery enabled in staging so Phase 13 drills exercise
  # the Rollout canary + AnalysisTemplate auto-rollback path.
  rollout:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  image:
    repository: shoplite-worker
    tag: "af3f30d362f5"
    digest: "sha256:85197c5354734a5f431050d05dfb8e993843c0358b13dff9f75a629ee38b4b32"
  replicaCount: 1

externalSecrets:
  enabled: true
  secretStoreName: azure-keyvault
  secretName: shoplite-secrets
  refreshInterval: 1h
  # From `terraform output key_vault_uri` in envs/staging/.
  vaultUrl: "https://kv-shoplite-staging-3kz3.vault.azure.net/"
  tenantId: "9ef0183b-ac0d-4452-9c52-6c00aa861770"

ingress:
  enabled: true
  # nip.io resolves <ip>.nip.io → <ip>. No DNS zone to buy.
  host: "staging.57.174.146.129.nip.io"
  clusterIssuer: letsencrypt-staging

monitoring:
  enabled: true

networkPolicies:
  enabled: true
  ingressNamespace: ingress-nginx
  postgresSubnetCidr: 10.40.18.0/24   # snet-db-staging
  vnetCidr: 10.40.0.0/16
  podCidr: 10.244.0.0/16
  serviceCidr: 10.0.0.0/16

rbac:
  devReadonly:
    enabled: true
    groupObjectId: ""   # add an Entra group object ID when one exists
