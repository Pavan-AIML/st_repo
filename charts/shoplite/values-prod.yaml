# Prod overrides. Differences from staging: own registry, higher replica
# counts, higher HPA ceiling, higher worker count.

env: prod

image:
  # Shared ACR per ADR-002 — same registry for both envs.
  registry: crshoplite.azurecr.io

serviceAccount:
  name: shoplite
  # From `terraform output workload_identity_client_ids` in envs/prod/.
  workloadIdentityClientId: "9ad31be6-fe4a-4af5-a796-f335087a22c7"

redis:
  url: "redis://redis-master.shoplite-prod.svc.cluster.local:6379"

api:
  image:
    repository: shoplite-api
    tag: "af3f30d362f5"
    digest: "sha256:165f9470fc86d9cbb457bf8c7413d40ebe92480a263ea7f6eaaf33d3802a7ad6"
  replicaCount: 3
  rollout:
    enabled: true
  resources:
    requests:
      cpu: 150m
      memory: 192Mi
    limits:
      cpu: 750m
      memory: 384Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  pdb:
    minAvailable: 2

worker:
  image:
    repository: shoplite-worker
    tag: "af3f30d362f5"
    digest: "sha256:85197c5354734a5f431050d05dfb8e993843c0358b13dff9f75a629ee38b4b32"
  replicaCount: 2
  pdb:
    minAvailable: 1

externalSecrets:
  enabled: true
  secretStoreName: azure-keyvault
  secretName: shoplite-secrets
  refreshInterval: 1h
  # From `terraform output key_vault_uri` in envs/prod/.
  vaultUrl: "https://kv-shoplite-prod-7wy5.vault.azure.net/"
  tenantId: "9ef0183b-ac0d-4452-9c52-6c00aa861770"

ingress:
  enabled: true
  host: "prod.57.174.146.129.nip.io"
  clusterIssuer: letsencrypt-staging

monitoring:
  enabled: true

networkPolicies:
  enabled: true
  ingressNamespace: ingress-nginx
  postgresSubnetCidr: 10.40.19.0/24   # snet-db-prod
  vnetCidr: 10.40.0.0/16
  podCidr: 10.244.0.0/16
  serviceCidr: 10.0.0.0/16

rbac:
  devReadonly:
    enabled: true
    groupObjectId: ""
