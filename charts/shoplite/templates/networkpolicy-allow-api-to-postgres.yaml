{{- if .Values.networkPolicies.enabled }}
# Allow api pods to reach Postgres on port 5432.
# Postgres lives at a private IP inside the env's DB subnet
# (configured via networkPolicies.postgresSubnetCidr per env).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.postgresSubnetCidr }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
