{{- if .Values.networkPolicies.enabled }}
# Allow worker pods to reach the in-cluster Redis (Bitnami chart) on 6379.
# api pods are deliberately NOT selected here — the T1-D acceptance check
# "api cannot reach Redis, worker can" relies on that absence combined with
# the namespace default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-to-redis
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
