{{- if .Values.networkPolicies.enabled }}
# Allow ingress-nginx (running in its own namespace) to reach api pods
# on port 8000. Only pods matching the api component label are exposed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shoplite.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
{{- end }}
