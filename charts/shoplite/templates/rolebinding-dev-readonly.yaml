{{- if and .Values.rbac.devReadonly.enabled .Values.rbac.devReadonly.groupObjectId }}
# Bind the developer read-only Role to an Entra group (by object ID).
# When the group is empty, we skip the binding — the Role exists but has
# no subjects, which is a safe default.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-readonly
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: {{ .Values.rbac.devReadonly.groupObjectId }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-readonly
  apiGroup: rbac.authorization.k8s.io
{{- end }}
