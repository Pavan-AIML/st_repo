apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shoplite.serviceAccountName" . }}
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    # This label is what the Azure Workload Identity mutating webhook
    # looks for. Without it, pods using this SA do not get a federated
    # token projected.
    azure.workload.identity/use: "true"
  annotations:
    # Entra client ID of the UAMI federated to this SA.
    # Comes from Terraform: module.identity.workload_identity_client_ids["shoplite"].
    # Set per env in values-<env>.yaml under serviceAccount.workloadIdentityClientId.
    azure.workload.identity/client-id: {{ required "serviceAccount.workloadIdentityClientId is required" .Values.serviceAccount.workloadIdentityClientId | quote }}
automountServiceAccountToken: true
