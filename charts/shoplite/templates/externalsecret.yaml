{{- if .Values.externalSecrets.enabled }}
# Namespace-scoped SecretStore — tells ESO how to reach this env's Azure
# Key Vault. Auth via Workload Identity: the shoplite ServiceAccount (already
# annotated with the UAMI client ID) has "Key Vault Secrets User" role on
# the vault, granted by the key_vault Terraform module.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      vaultUrl: {{ required "externalSecrets.vaultUrl is required" .Values.externalSecrets.vaultUrl | quote }}
      tenantId: {{ required "externalSecrets.tenantId is required" .Values.externalSecrets.tenantId | quote }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: {{ include "shoplite.serviceAccountName" . }}
---
# ExternalSecret — pulls secrets out of Key Vault and writes them to a
# native K8s Secret that Deployments reference via envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    # KV secret names use dashes; env vars use underscores. Map here.
    - secretKey: DATABASE_URL
      remoteRef:
        key: database-url
{{- end }}
