{{- if .Values.monitoring.enabled }}
# Grafana dashboard-as-code for shoplite-api.
# Delivered via ConfigMap with the kube-prometheus-stack Grafana sidecar
# label (grafana_dashboard=1), which auto-imports it into Grafana at runtime.
# Panels cover the five metrics the task spec requires:
#   - Request rate (RPS by path)
#   - Error rate (5xx / total)
#   - Latency percentiles (p50 / p95 / p99)
#   - Saturation (CPU and memory of api pods)
#   - Error-budget remaining (30d availability SLO at 99.5%)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shoplite.fullname" . }}-api-dashboard
  labels:
    {{- include "shoplite.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  shoplite-api.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["shoplite", "slo"],
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "",
      "title": "ShopLite API — RED + SLO",
      "uid": "shoplite-api-red-slo",
      "version": 1,
      "refresh": "30s",
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (RPS by path)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "sum by (path) (rate(http_requests_total{job=\"shoplite-shoplite-api\"}[5m]))",
            "legendFormat": "{{"{{"}} path {{"}}"}}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx fraction)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "(sum(rate(http_requests_total{job=\"shoplite-shoplite-api\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"shoplite-shoplite-api\"}[5m]))) or vector(0)",
            "legendFormat": "5xx ratio"
          }],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.005}, {"color": "red", "value": 0.01}]}}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency percentiles (seconds)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"shoplite-shoplite-api\"}[5m])))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"shoplite-shoplite-api\"}[5m])))", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"shoplite-shoplite-api\"}[5m])))", "legendFormat": "p99"}
          ],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Saturation — CPU / memory per api pod",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"shoplite-staging\",container=\"api\"}[5m]))", "legendFormat": "cpu {{"{{"}} pod {{"}}"}}"},
            {"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"shoplite-staging\",container=\"api\"}) / 1048576", "legendFormat": "mem MiB {{"{{"}} pod {{"}}"}}"}
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "30d error-budget remaining (availability SLO 99.5%)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "expr": "1 - ((sum(increase(http_requests_total{job=\"shoplite-shoplite-api\",status=~\"5..\"}[30d])) / sum(increase(http_requests_total{job=\"shoplite-shoplite-api\"}[30d]))) / 0.005)"
          }],
          "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": -0.5, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.1}, {"color": "green", "value": 0.3}]}}},
          "options": {"colorMode": "background", "graphMode": "area", "textMode": "auto"}
        }
      ]
    }
{{- end }}
